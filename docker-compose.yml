services:
  postgres:
    image: postgres:18-alpine
    container_name: vmtipping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vmtipping
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a version-specific subdir and expects the volume
      # mounted at /var/lib/postgresql (not /…/data), or it refuses to start.
      - vmtipping-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vmtipping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vmtipping-pgdata:
