services:
  postgres:
    image: postgres:18-alpine
    container_name: vmtipping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vmtipping
    ports:
      - "5432:5432"
    volumes:
      - vmtipping-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vmtipping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vmtipping-pgdata:
